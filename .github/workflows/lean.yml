name: Lean and Cases

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build Lean certificates
        run: lake build
      - name: Validate positive and negative cases
        run: python3 scripts/validate_cases.py
      - name: Render legacy positive prompts
        run: python3 scripts/generate_prompts.py --cases experiments/cases/transitivity_v0.jsonl --out /tmp/ppi-positive.jsonl
      - name: Render legacy negative prompts
        run: python3 scripts/generate_prompts.py --cases experiments/cases/negative_v0.jsonl --out /tmp/ppi-negative.jsonl
      - name: Render minimal paired benchmark
        run: python3 scripts/generate_paired_benchmark.py --out /tmp/ppi-paired.jsonl
