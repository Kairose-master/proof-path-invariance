name: Lean and Cases

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build Lean certificates
        run: lake build
      - name: Validate experiment cases
        run: python3 scripts/validate_cases.py
      - name: Render frozen prompts
        run: python3 scripts/generate_prompts.py --out /tmp/ppi-prompts.jsonl
