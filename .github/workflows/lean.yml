name: Lean and Cases

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build Lean certificates
        run: lake build
      - name: Validate smoke-test cases
        run: python3 scripts/validate_cases.py
      - name: Generate symbolic v0 cases
        run: python3 scripts/generate_symbolic_cases.py --out /tmp/symbolic_v0.jsonl
      - name: Validate symbolic v0 cases
        run: python3 scripts/validate_cases.py /tmp/symbolic_v0.jsonl
      - name: Render minimal paired benchmark
        run: python3 scripts/generate_paired_benchmark.py --cases /tmp/symbolic_v0.jsonl --out /tmp/ppi-paired.jsonl
      - name: Validate minimal paired benchmark
        run: python3 scripts/validate_paired_benchmark.py /tmp/ppi-paired.jsonl
      - name: Verify frozen benchmark hashes
        run: python3 scripts/verify_benchmark_lock.py /tmp/symbolic_v0.jsonl /tmp/ppi-paired.jsonl
      - name: Generate Phase 2 S3 benchmark
        run: python3 scripts/generate_s3_benchmark.py --out /tmp/s3_v0.jsonl
      - name: Validate Phase 2 S3 benchmark
        run: python3 scripts/validate_s3_benchmark.py /tmp/s3_v0.jsonl
      - name: Report Phase 2 S3 benchmark hash
        run: sha256sum /tmp/s3_v0.jsonl
      - name: Verify frozen Phase 2 S3 benchmark
        run: python3 scripts/verify_s3_lock.py /tmp/s3_v0.jsonl
      - name: Generate unseen-family confirmatory S3 benchmark
        run: python3 scripts/generate_s3_unseen_benchmark.py --out /tmp/s3_unseen_v0.jsonl
      - name: Validate unseen-family confirmatory S3 benchmark
        run: python3 scripts/validate_s3_unseen_benchmark.py /tmp/s3_unseen_v0.jsonl
      - name: Report unseen-family benchmark hash
        run: sha256sum /tmp/s3_unseen_v0.jsonl
      - name: Verify frozen unseen-family benchmark
        run: python3 scripts/verify_s3_unseen_lock.py /tmp/s3_unseen_v0.jsonl
      - name: Validate JSON schemas and run template
        run: |
          python3 -m json.tool experiments/schemas/run_manifest.schema.json >/dev/null
          python3 -m json.tool experiments/schemas/result_row.schema.json >/dev/null
          python3 scripts/validate_run_artifacts.py experiments/runs/manifest.template.json --allow-placeholders
      - name: Syntax-check model runner and analysis
        run: |
          python3 -m py_compile scripts/run_hf_logit_margin.py
          python3 -m py_compile scripts/create_run_manifest.py
          python3 -m py_compile scripts/validate_run_artifacts.py
          python3 -m py_compile scripts/score_flips.py
          python3 -m py_compile scripts/generate_s3_benchmark.py
          python3 -m py_compile scripts/validate_s3_benchmark.py
          python3 -m py_compile scripts/run_hf_s3_margin.py
          python3 -m py_compile scripts/score_s3.py
          python3 -m py_compile scripts/verify_s3_lock.py
          python3 -m py_compile scripts/analyze_s3_generalization.py
          python3 -m py_compile scripts/generate_s3_unseen_benchmark.py
          python3 -m py_compile scripts/validate_s3_unseen_benchmark.py
          python3 -m py_compile scripts/score_s3_unseen_confirmatory.py
          python3 -m py_compile scripts/verify_s3_unseen_lock.py
