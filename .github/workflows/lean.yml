name: Lean and Cases

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build Lean certificates
        run: lake build
      - name: Validate smoke-test cases
        run: python3 scripts/validate_cases.py
      - name: Generate symbolic v0 cases
        run: python3 scripts/generate_symbolic_cases.py --out /tmp/symbolic_v0.jsonl
      - name: Validate symbolic v0 cases
        run: python3 scripts/validate_cases.py /tmp/symbolic_v0.jsonl
      - name: Render minimal paired benchmark
        run: python3 scripts/generate_paired_benchmark.py --cases /tmp/symbolic_v0.jsonl --out /tmp/ppi-paired.jsonl
      - name: Validate minimal paired benchmark
        run: python3 scripts/validate_paired_benchmark.py /tmp/ppi-paired.jsonl
      - name: Verify frozen benchmark hashes
        run: python3 scripts/verify_benchmark_lock.py /tmp/symbolic_v0.jsonl /tmp/ppi-paired.jsonl
      - name: Validate JSON schemas and run template
        run: |
          python3 -m json.tool experiments/schemas/run_manifest.schema.json >/dev/null
          python3 -m json.tool experiments/schemas/result_row.schema.json >/dev/null
          python3 scripts/validate_run_artifacts.py experiments/runs/manifest.template.json --allow-placeholders
      - name: Syntax-check model runner and analysis
        run: |
          python3 -m py_compile scripts/run_hf_logit_margin.py
          python3 -m py_compile scripts/validate_run_artifacts.py
          python3 -m py_compile scripts/score_flips.py
